<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | ORACLE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components/staggered-menu.css">
</head>
<body style="padding-top: 80px;">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card card-custom p-4">
            <h3 class="text-center text-info mb-4">Operative Registration</h3>
            <form action="../index.html" method="GET">
                <div class="mb-3"><label class="form-label">Team Name</label><input type="text" class="form-control bg-dark text-white border-info" required></div>
                <div class="mb-3"><label class="form-label">Operative Leader Name</label><input type="text" class="form-control bg-dark text-white border-info" required></div>
                <div class="mb-3"><label class="form-label">Event Selection</label><select class="form-select bg-dark text-white border-info"><option value="codebreaker">Code Breaker</option><option value="robowars">Robo Wars</option><option value="cyberhunt">Cyber Hunt</option><option value="vstrike">V-Strike (Tactical FPS)</option></select></div>
                <button type="submit" class="btn btn-danger w-100">Initialize Sequence (Submit)</button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="../js/components/staggered-menu.js"></script>
    <script>
        StaggeredMenu.init({
            position: 'right',
            colors: ['#1a1a24', '#ff003c'],
            logoText: 'ORACLE',
            logoLink: '../index.html',
            menuButtonColor: '#00f3ff',
            openMenuButtonColor: '#fff',
            accentColor: '#ff003c',
            changeMenuColorOnOpen: true,
            isFixed: true,
            displaySocials: true,
            displayItemNumbering: true,
            items: [
                { label: 'Home', ariaLabel: 'Go to home page', link: '../index.html' },
                { label: 'Events', ariaLabel: 'View events', link: 'events.html' },
                { label: 'Rules', ariaLabel: 'View rules and regulations', link: 'rules.html' },
                { label: 'Teams', ariaLabel: 'View registered teams', link: 'teams.html' },
                { label: 'Upload', ariaLabel: 'Upload audio', link: '../api/upload.php' },
                { label: 'Scores', ariaLabel: 'View live scores', link: 'live_score.html' }
            ],
            socialItems: [
                { label: 'Instagram', link: 'https://instagram.com' },
                { label: 'Twitter', link: 'https://twitter.com' },
                { label: 'YouTube', link: 'https://youtube.com' }
            ]
        });
    </script>
</body>
</html>
