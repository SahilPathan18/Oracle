<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Score | ORACLE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components/staggered-menu.css">
</head>
<body style="padding-top: 80px;">
    <div class="container mt-5">
        <h2 class="text-center text-danger mb-4">Live Survival Leaderboard</h2>
        <div class="table-responsive">
            <table class="table table-dark table-hover border-info">
                <thead><tr><th class="text-info">Rank</th><th class="text-info">Squadron</th><th class="text-info">Score</th><th class="text-info">Status</th></tr></thead>
                <tbody id="scoreTableBody"><tr><td colspan="4" class="text-center">Establishing secure connection...</td></tr></tbody>
            </table>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="../js/components/staggered-menu.js"></script>
    <script>
        StaggeredMenu.init({
            position: 'right',
            colors: ['#1a1a24', '#ff003c'],
            logoText: 'ORACLE',
            logoLink: '../index.html',
            menuButtonColor: '#00f3ff',
            openMenuButtonColor: '#fff',
            accentColor: '#ff003c',
            changeMenuColorOnOpen: true,
            isFixed: true,
            displaySocials: true,
            displayItemNumbering: true,
            items: [
                { label: 'Home', ariaLabel: 'Go to home page', link: '../index.html' },
                { label: 'Events', ariaLabel: 'View events', link: 'events.html' },
                { label: 'Rules', ariaLabel: 'View rules and regulations', link: 'rules.html' },
                { label: 'Teams', ariaLabel: 'View registered teams', link: 'teams.html' },
                { label: 'Upload', ariaLabel: 'Upload audio', link: '../api/upload.php' },
                { label: 'Scores', ariaLabel: 'View live scores', link: 'live_score.html' }
            ],
            socialItems: [
                { label: 'Instagram', link: 'https://instagram.com' },
                { label: 'Twitter', link: 'https://twitter.com' },
                { label: 'YouTube', link: 'https://youtube.com' }
            ]
        });

        function fetchScores() {
            fetch('../api/scores.php').then(response => response.json()).then(data => {
                const tbody = document.getElementById('scoreTableBody'); tbody.innerHTML = '';
                data.sort((a, b) => b.score - a.score);
                data.forEach((team, index) => {
                    const statusClass = team.status === 'SURVIVING' ? 'text-success' : 'text-danger';
                    tbody.innerHTML += `<tr><td>${index + 1}</td><td>${team.name}</td><td>${team.score}</td><td class="${statusClass}">${team.status}</td></tr>`;
                });
            }).catch(error => console.error('Error fetching data:', error));
        }
        fetchScores(); setInterval(fetchScores, 3000);
    </script>
</body>
</html>
